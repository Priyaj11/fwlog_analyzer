[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fwlog"
version = "0.1.0"
description = "Firmware/RTOS log analyzer & timing-anomaly detector"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
dev = ["pytest>=7"]

[project.scripts]
fwlog = "fwlog.cli:main"

[tool.setuptools]
packages = ["fwlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
